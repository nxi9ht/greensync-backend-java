spring:
  application:
    name: greensync-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:project-green}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Mirrors DB_SYNCHRONIZE in the NestJS backend: validate in every environment,
      # schema is owned by Flyway migrations, never by Hibernate auto-DDL.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:your_super_secret_jwt_key_here}
    expiration-minutes: 60
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  gemini:
    api-key: ${GEMINI_API_KEY:}

springdoc:
  api-docs:
    enabled: ${ENABLE_SWAGGER:false}
  swagger-ui:
    enabled: ${ENABLE_SWAGGER:false}
